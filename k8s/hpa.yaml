apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: markitdown-api-hpa
  namespace: markitdown-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: markitdown-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: markitdown-worker-hpa
  namespace: markitdown-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: markitdown-worker
  minReplicas: 1
  maxReplicas: 8
  metrics:
    # CPU only, deliberately. A worker mid-chunk legitimately sits near its
    # memory limit, and that memory does not fall when the queue drains, so a
    # memory target would scale up on load and then refuse to scale back down.
    #
    # The honest metric is queue depth — jobstore.pending_depth() — which needs
    # KEDA or a custom metrics adapter. CPU is a lagging proxy: an idle worker
    # blocks at ~0% CPU, so a cold burst scales up only once work is already
    # running. Acceptable for throughput, and worth revisiting.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Long window: chunks take minutes, and killing a worker mid-chunk means
      # waiting out its lease before the work is retried.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
