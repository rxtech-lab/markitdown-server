# CI-only self-hosted libSQL server (sqld).
#
# The API and worker pods must share one database — a SQLite file on a pod's
# local disk cannot be, which is why this exists rather than a PVC. For a
# Release deployments use the hosted Turso database configured in their Secret.
# test.yaml applies this manifest only to its disposable minikube.
#
# Unlike the Redis it replaces, this is a durable store, not a cache: it holds
# the queue and every job's state. Hence a PVC and Recreate rather than an
# ephemeral pod with an eviction policy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: markitdown-libsql-data
  namespace: markitdown-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: markitdown-libsql
  namespace: markitdown-server
  labels:
    app: markitdown-libsql
spec:
  replicas: 1
  strategy:
    # SQLite takes a single writer lock on the data directory, so the new pod
    # must not start until the old one has released it.
    type: Recreate
  selector:
    matchLabels:
      app: markitdown-libsql
  template:
    metadata:
      labels:
        app: markitdown-libsql
    spec:
      containers:
        - name: libsql
          image: ghcr.io/tursodatabase/libsql-server:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SQLD_NODE
              value: "primary"
            - name: SQLD_DB_PATH
              value: "/var/lib/sqld/markitdown.db"
            - name: SQLD_HTTP_LISTEN_ADDR
              value: "0.0.0.0:8080"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/sqld
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: markitdown-libsql-data

---
apiVersion: v1
kind: Service
metadata:
  name: markitdown-libsql
  namespace: markitdown-server
  labels:
    app: markitdown-libsql
spec:
  selector:
    app: markitdown-libsql
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
