apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: markitdown-ingress
  namespace: markitdown-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Request bodies are a JSON object holding a URL; the source document is
    # fetched server-side, so the old 1000m cap was vestigial.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # /convert preserves the original blocking contract, and large PDFs can
    # take several minutes. /async/convert is available to avoid a long request.
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # No session affinity: every pod reads the same database and object store,
    # so any pod can answer any request. Affinity is what made replicas > 1
    # useless before.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - markdownparser.mcprouter.app
      secretName: markitdown-tls
  rules:
    - host: markdownparser.mcprouter.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: markitdown-server
                port:
                  number: 8080
