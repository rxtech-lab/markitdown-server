apiVersion: apps/v1
kind: Deployment
metadata:
  name: markitdown-server
  namespace: markitdown-server
  labels:
    app: markitdown-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: markitdown-server
  template:
    metadata:
      labels:
        app: markitdown-server
    spec:
      # Conversions can run for ~60s; let in-flight requests drain on rollout
      # instead of being SIGKILLed after the default 30s.
      terminationGracePeriodSeconds: 120
      volumes:
      containers:
        - name: markitdown-server
          image: ghcr.io/sirily11/markitdown-server:latest
          resources:
            limits:
              memory: "1024Mi"
              cpu: "500m"
            requests:
              # Baseline RSS is ~120-140Mi; a 128Mi request pinned memory
              # utilization at ~100% and kept the HPA at max replicas.
              memory: "384Mi"
              cpu: "250m"
          env:
            - name: REDIS_URL
              value: "redis://markitdown-redis:6379/0"
            - name: OPENAI_MODEL
              value: "google/gemini-2.5-flash-preview-05-20"
          envFrom:
            - secretRef:
                name: markitdown-server-secret
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: markitdown-server
  namespace: markitdown-server
  labels:
    app: markitdown-server
spec:
  selector:
    app: markitdown-server
  ports:
    - port: 8080
      targetPort: 8000
  type: ClusterIP
