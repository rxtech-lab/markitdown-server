[project]
name = "markitdown-server"
version = "0.1.0"
description = ""
authors = [
    {name = "sirily11",email = "32106111+sirily11@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "markitdown[all] (>=0.1.5,<0.2.0)",
    "openai (>=1.82.1,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pypdf (>=6.1.1,<7.0.0)",
    "boto3 (>=1.40.0,<2.0.0)",
    # Only needed to talk to hosted Turso; local/CI runs use stdlib sqlite3.
    "libsql (>=0.1.11,<0.2.0)",
    "pika (>=1.3.0,<2.0.0)",
    # Serialising the generated OpenAPI document at /openapi.yaml. Arrives
    # transitively via markitdown too, but this is a direct import now.
    "PyYAML (>=6.0,<7.0)"
]

[project.optional-dependencies]
test = [
    "pytest (>=8.0.0,<9.0.0)",
    "reportlab (>=4.0.0,<5.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "moto[s3] (>=5.0.0,<6.0.0)",
]

[tool.pytest.ini_options]
# Source modules live at the repo root and are imported flat.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: exercises real markitdown conversion rather than a stub",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
